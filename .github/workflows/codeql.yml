name: "CodeQL Analysis"

on:
  workflow_call:

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Supported languages: 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift'
        language: [ 'nodejs', 'golang' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Initializes the CodeQL tools and creates a database for the specified languages
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # 'autobuild' attempts to build compiled languages automatically. 
        # Use 'manual' if you need to run specific build commands first.
        build-mode: autobuild

    # Performs the actual static analysis and uploads results to GitHub's Security tab
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3